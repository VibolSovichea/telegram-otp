services:
  redis:
    image: redis:7-alpine
    container_name: otp_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    container_name: otp_postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: otp_user
      POSTGRES_PASSWORD: otp_password
      POSTGRES_DB: otp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
